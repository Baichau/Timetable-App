<!-- templates/todo.html -->
{% extends "base.html" %}

{% block title %}To-Do List - EduFocus{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/todo.css') }}">
{% endblock %}

{% block content %}
<div class="todo-container">
    <h1>To-Do List</h1>
    <p>Stay organized with your tasks and assignments</p>
    
    <div class="todo-stats">
        <h3>Your Progress</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="total-todos">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="completed-todos">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="pending-todos">0</span>
                <span class="stat-label">Pending</span>
            </div>
        </div>
    </div>
    
    <div class="todo-card">
        <form class="todo-form">
            <input type="text" id="todo-input" placeholder="Add a new task..." required>
            <button type="submit" id="add-todo-btn" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add Task
            </button>
        </form>
        
        <div class="todo-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button id="clear-completed-btn" class="btn btn-danger">
                <i class="fas fa-trash"></i> Clear Completed
            </button>
        </div>
        
        <ul class="todo-list">
            <!-- Todos will be inserted here by JavaScript -->
        </ul>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/todo.js') }}"></script>
{% endblock %}
